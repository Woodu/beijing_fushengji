name: Build Beijing Fushengji (Win32)

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake (Win32 / Release)
        run: |
          cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item build\Release\DualListDemo.exe artifact\
          Copy-Item Product\News.txt  artifact\
          Copy-Item Product\score.txt artifact\
          Copy-Item Product\Tips.txt  artifact\
          Copy-Item Product\helpinfo  artifact\
          Copy-Item Product\sound     artifact\sound -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beijing-fushengji-win32
          path: artifact\
